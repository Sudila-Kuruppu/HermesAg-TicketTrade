<!--
  TicketTrade mockup partial — <head>
  Substitutes the page title via the {title} placeholder.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<noscript><style>:root{color-scheme:dark;}</style></noscript>
<title>{title}</title>

<!-- FOUC-guard: must run BEFORE the CSS link. Mirrors themeController priority. -->
<script>
  (function () {
    try {
      var stored = window.localStorage.getItem('tickettrade.theme');
      var valid = stored === 'light' || stored === 'dark' || stored === 'system';
      var mode = valid ? stored : 'system';
      var resolved;
      if (mode === 'system') {
        var surface = document.documentElement.getAttribute('data-surface');
        if (surface === 'admin') {
          resolved = 'light';
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          resolved = 'dark';
        } else {
          resolved = 'light';
        }
      } else {
        resolved = mode;
      }
      document.documentElement.setAttribute('data-theme', resolved);
    } catch (e) { /* localStorage blocked, themeController will hydrate */ }
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="../assets/css/tickettrade.css">
<script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script defer src="../assets/js/tickettrade.js"></script>
