<!-- TicketTrade mockup partial — error state with retry button (UX-DR-34)
     The Tap-to-retry button is wired by tickettrade.js (emptyErrorRetry component)
     to dispatch tickettrade:retry and log console.info. -->
<div class="error-state" data-error-state>
  <svg class="error-state__illustration" viewBox="0 0 96 96" aria-hidden="true">
    <circle cx="48" cy="48" r="34" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="48" y1="32" x2="48" y2="54" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    <circle cx="48" cy="64" r="2.5" fill="currentColor"/>
  </svg>
  <h2 class="error-state__title">We couldn't load this list</h2>
  <p class="error-state__description">Your connection might be slow. Try again, or come back in a minute.</p>
  <button type="button" class="error-state__retry" data-error-state>Tap to retry</button>
</div>
